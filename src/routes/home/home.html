<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This is equivalent of a HTTP header -->
    <!-- Supporting discovery by crawlers and bots -->
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <title>Home</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
        }

        p {
            font-size: 2em;
            font-weight: 600;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            animation: fadeIn 3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .floating-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .floating-bubbles span {
            position: absolute;
            bottom: -150px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: bubble 20s infinite;
        }

        @keyframes bubble {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-1000px) scale(1.5);
                opacity: 0;
            }
        }

        .floating-bubbles span:nth-child(1) {
            left: 10%;
            animation-duration: 18s;
            width: 25px;
            height: 25px;
        }
        .floating-bubbles span:nth-child(2) {
            left: 30%;
            animation-duration: 22s;
            width: 15px;
            height: 15px;
        }
        .floating-bubbles span:nth-child(3) {
            left: 50%;
            animation-duration: 20s;
        }
        .floating-bubbles span:nth-child(4) {
            left: 70%;
            animation-duration: 25s;
            width: 30px;
            height: 30px;
        }
        .floating-bubbles span:nth-child(5) {
            left: 85%;
            animation-duration: 27s;
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
<div class="floating-bubbles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<p>Welcome to your personal newsletter</p>
</body>
</html>
